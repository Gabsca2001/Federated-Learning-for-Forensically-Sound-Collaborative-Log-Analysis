schema_version: "1.0"
experiment_id: m3-fedavg-multiseed-v2
base_federation_config: configs/federation.yaml

# The non-IID partitioner may try seed + attempt for up to 512 attempts.
# A spacing of 1000 keeps those deterministic retry streams disjoint.
seeds: [341593, 342593, 343593, 344593, 345593]
modes: [iid, non-iid]

execution:
  device: cuda

statistics:
  primary_metric: macro_f1_all_model_classes
  primary_split: test
  standard_deviation: sample
  confidence_interval: student-t-95-percent
  pairing: by-seed
