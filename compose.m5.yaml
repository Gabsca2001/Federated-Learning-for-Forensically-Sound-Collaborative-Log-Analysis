x-m5-tpm: &m5-tpm
  build:
    context: .
    dockerfile: Dockerfile.m4
  entrypoint: ["/app/scripts/run_swtpm.sh"]
  read_only: true
  cap_drop: [ALL]
  cap_add: [FOWNER]
  security_opt: ["no-new-privileges:true"]
  network_mode: "none"
  tmpfs: ["/tmp:size=16m,mode=1777"]
  healthcheck:
    test: ["CMD-SHELL", "TPM2TOOLS_TCTI=swtpm:path=/run/swtpm/swtpm.sock tpm2_getcap -Q properties-fixed >/dev/null 2>&1"]
    interval: 2s
    timeout: 2s
    retries: 30

x-m5-client: &m5-client
  image: "${M5_RUNTIME_IMAGE:-flforensics-m5-runtime:latest}"
  profiles: ["secure-round"]
  user: "${M5_UID:-1000}:${M5_GID:-1000}"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  network_mode: "none"
  tmpfs: ["/tmp:size=64m,mode=1777"]

services:
  tpm01:
    <<: *m5-tpm
    volumes: [tpm01_state:/var/lib/swtpm, tpm01_socket:/run/swtpm]
  client01:
    <<: *m5-client
    depends_on: {tpm01: {condition: service_healthy}}
    command: ["m5-client-update", "--public-workspace", "/campaign/public", "--client-dataset", "/client/dataset.json", "--client-manifest", "/client/manifest.json", "--node-workspace", "/runtime", "--submission-workspace", "/submission", "--client-id", "client01", "--tcti", "swtpm:path=/run/swtpm/swtpm.sock"]
    volumes:
      - tpm01_socket:/run/swtpm
      - ${M4_NODE_ROOT:-./artifacts/m4-nodes}/client01:/runtime:ro
      - ${M5_PARTITION_WORKSPACE:-./artifacts/m3-data24-parquet-iid}/clients/client01/dataset.json:/client/dataset.json:ro
      - ${M5_PARTITION_WORKSPACE:-./artifacts/m3-data24-parquet-iid}/clients/client01/manifest.json:/client/manifest.json:ro
      - ${M5_WORKSPACE:-./artifacts/m5-secure-round}/public:/campaign/public:ro
      - ${M5_WORKSPACE:-./artifacts/m5-secure-round}/submissions/client01:/submission

