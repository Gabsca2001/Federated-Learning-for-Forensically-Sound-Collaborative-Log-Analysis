[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fl-forensics-pipeline"
version = "0.3.1"
description = "Forensically-sound federated Zeek log analysis prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=45,<47",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
m2 = [
  "numpy>=2,<3",
  "scikit-learn>=1.7,<2",
]
federated = [
  "flwr>=1.32,<2",
  "numpy>=2,<3",
  "scikit-learn>=1.7,<2",
  "torch>=2.7,<3",
]
simulation = ["flwr[simulation]>=1.32,<2"]
reporting = ["matplotlib>=3.10,<4"]
ml = [
  "flwr>=1.32,<2",
  "matplotlib>=3.10,<4",
  "numpy>=2,<3",
  "scikit-learn>=1.7,<2",
  "torch>=2.7,<3",
]
dev = ["pytest>=8,<9", "ruff>=0.12,<1"]

[project.scripts]
fl-forensics = "fl_forensics.cli:main"

[tool.flwr.app]
publisher = "gabska"

[tool.flwr.app.components]
serverapp = "fl_forensics.flower_server:app"
clientapp = "fl_forensics.flower_client:app"

[tool.flwr.app.config]
num-server-rounds = 30
local-epochs = 2
batch-size = 128
learning-rate = 0.001
seed = 341593
partition-workspace = "artifacts/m3-data24-iid"
save-model = false

[tool.flwr.federations]
default = "local-simulation"

[tool.flwr.federations.local-simulation]
address = ":local:"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
