x-swtpm-common: &swtpm-common
  build:
    context: .
    dockerfile: Dockerfile.m4
  entrypoint: ["/app/scripts/run_swtpm.sh"]
  read_only: true
  cap_drop: [ALL]
  cap_add: [FOWNER]
  security_opt: ["no-new-privileges:true"]
  network_mode: "none"
  tmpfs:
    - /tmp:size=16m,mode=1777
  healthcheck:
    test: ["CMD-SHELL", "TPM2TOOLS_TCTI=swtpm:path=/run/swtpm/swtpm.sock tpm2_getcap -Q properties-fixed >/dev/null 2>&1"]
    interval: 2s
    timeout: 2s
    retries: 30

x-client-common: &client-common
  build:
    context: .
    dockerfile: Dockerfile.m4
  profiles: ["provision"]
  user: "${M4_UID:-1000}:${M4_GID:-1000}"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  networks: [trust]
  tmpfs:
    - /tmp:size=32m,mode=1777

services:
  tpm01:
    <<: *swtpm-common
    volumes: [tpm01_state:/var/lib/swtpm, tpm01_socket:/run/swtpm]
  client01:
    <<: *client-common
    depends_on: {tpm01: {condition: service_healthy}}
    command: ["m4-tpm-provision", "--workspace", "/runtime", "--project-root", "/app", "--config", "/app/configs/trust.yaml", "--client-id", "client01", "--node-id", "node01", "--tpm-instance", "tpm01", "--tcti", "swtpm:path=/run/swtpm/swtpm.sock", "--trust-level", "swtpm"]
    volumes: [tpm01_socket:/run/swtpm, ./artifacts/m4-nodes/client01:/runtime]

